version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: connections-backend
    ports:
      - "3070:3070"
    volumes:
      - ./backend/credentials.json:/app/credentials.json:ro
      - ./backend/.env:/app/.env:ro
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - default
      - proxy-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: connections-frontend
    ports:
      - "3069:3069"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true
