version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: connections-backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend/credentials.json:/app/credentials.json:ro
      - ./backend/.env:/app/.env:ro
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: connections-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
